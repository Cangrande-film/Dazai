[package]
name = "dazai"
version = "0.2.0"
edition = "2021"
description = "A minimalist typed-reading SRS for Japanese"

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
ureq = { version = "2", default-features = false, features = ["json", "gzip", "native-tls"] }
native-tls = "0.2"
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3"] }

[profile.release]
opt-level = 3
strip = true
